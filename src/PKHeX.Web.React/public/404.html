<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        sessionStorage.redirect = location.href;
        var repo = location.pathname.split('/')[1];
        location.replace(repo ? '/' + repo + '/' : '/');
    </script>
</head>
<body>
    If you are not redirected automatically, follow this <a href="./index.html">link to the homepage</a>.
</body>
</html>
