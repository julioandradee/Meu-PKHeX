name: PKHeX.Web

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/PKHeX.Web.React/**'
      - 'src/PKHeX.Facade/**'
      - 'src/PKHeX.Everywhere.Engine*/**'
      - '.github/workflows/pkhex-web.yml'
      
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          
      - name: Update submodules to the latest commit
        run: |
          git submodule update --remote --recursive
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Install Engine SDK dependencies
        working-directory: src/PKHeX.Everywhere.Engine.Sdk
        run: npm ci

      - name: Build the Engine Vite plugin
        working-directory: src/PKHeX.Everywhere.Engine.Sdk/packages/engine
        run: npx vite build

      - name: Build PKHeX.Web.React
        working-directory: src/PKHeX.Web.React
        env:
          VITE_GOOGLE_ANALYTICS: 'false'
          VITE_SENTRY: 'false'
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src/PKHeX.Web.React/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_and_publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
