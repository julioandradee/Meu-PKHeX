# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'external/**'
      - 'PKHeX.CLI.sln'
    
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_tag.CLI_VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Update submodules to the latest commit
        run: |
          git submodule update --remote --recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Check generated engine TypeScript
        run: |
          changes=$(git status --porcelain -- src/PKHeX.Everywhere.Engine.Sdk)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- src/PKHeX.Everywhere.Engine.Sdk
            echo "::error::Generated engine TypeScript is out of date. Build PKHeX.Everywhere.Engine.CodeGen and commit the changes."
            exit 1
          fi
      - name: Test
        run: dotnet test --no-build --verbosity normal --filter Category!=E2E

  engine_sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/PKHeX.Everywhere.Engine.Sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  engine_sdk_packages:
    needs: changes
    if: always() && (needs.changes.outputs.sdk == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Update submodules to the latest commit
        run: |
          git submodule update --remote --recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Engine SDK dependencies
        working-directory: src/PKHeX.Everywhere.Engine.Sdk
        run: npm ci
      - name: Load the sample save from the packed tarballs
        working-directory: src/PKHeX.Everywhere.Engine.Sdk/example
        run: ./smoke.sh

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'src/PKHeX.Web.React/**'
              - 'src/PKHeX.Facade/**'
              - 'src/PKHeX.Everywhere.Engine*/**'
              - 'src/PKHeX.Web.E2E/**'
              - 'external/**'
            sdk:
              - 'src/PKHeX.Everywhere.Engine*/**'
              - 'src/PKHeX.Facade/**'
              - 'src/PKHeX.Web.React/public/data/**'
              - 'external/**'
              - '.github/workflows/dotnet.yml'

